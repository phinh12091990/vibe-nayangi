<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Lime Gradient -->
    <linearGradient id="brandLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf246"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Bowl Shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandLime)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" fill="none"/>

  <!-- Steaming Bowl (🍲) Icon -->
  <g filter="url(#iconShadow)">
    <!-- Steam Curves -->
    <path d="M23 16c-1-2.8 1-4.8 0-7.5" stroke="url(#steamGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32 14c-1.2-3 1.2-5.5 0-8.5" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M41 16c-1-2.8 1-4.8 0-7.5" stroke="url(#steamGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Chopsticks Pair -->
    <line x1="15" y1="20" x2="49" y2="28" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="17" y1="16" x2="51" y2="25" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Soup Broth Surface -->
    <ellipse cx="32" cy="30" rx="18.5" ry="4.5" fill="#fef08a"/>
    <ellipse cx="32" cy="30" rx="16" ry="3.2" fill="#f59e0b"/>

    <!-- Bowl Body (Deep charcoal slate for crisp contrast against lime) -->
    <path d="M13.5 30c0 10.5 8.3 19 18.5 19s18.5-8.5 18.5-19H13.5z" fill="#0f172a"/>
    
    <!-- Bowl Base Foot -->
    <path d="M23 48.5h18c0 2-2 3.5-4 3.5H27c-2 0-4-1.5-4-3.5z" fill="#0f172a"/>

    <!-- Bowl Highlight Rim Reflection -->
    <path d="M16 33.5c1.8 7 7.5 13 15 14" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Fresh Food Garnishes -->
    <circle cx="27.5" cy="29.8" r="2.2" fill="#10b981"/>
    <circle cx="35.5" cy="29.2" r="2" fill="#ef4444"/>
    <circle cx="31.5" cy="31.2" r="1.8" fill="#ffffff"/>
  </g>
</svg>