<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4528"/>
      <stop offset="60%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>

  <!-- Steaming Bowl Illustration -->
  <g filter="url(#glow)">
    <!-- Steam waves -->
    <path d="M24 18c-1-3 1-5 0-8" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 16c-1.2-3.5 1.2-6 0-9.5" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40 18c-1-3 1-5 0-8" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Chopsticks -->
    <line x1="16" y1="20" x2="48" y2="28" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <line x1="18" y1="16" x2="50" y2="25" stroke="#ffe082" stroke-width="2" stroke-linecap="round"/>

    <!-- Bowl Rim Soup Layer -->
    <ellipse cx="32" cy="30" rx="18" ry="4.5" fill="#ffe0b2"/>
    <ellipse cx="32" cy="30" rx="15.5" ry="3.2" fill="#ff9800"/>

    <!-- Bowl Body -->
    <path d="M14 30c0 10.5 8 19 18 19s18-8.5 18-19H14z" fill="#ffffff"/>
    
    <!-- Bowl Decorative Base/Stand -->
    <path d="M23 48.5h18c0 2-2 3.5-4 3.5H27c-2 0-4-1.5-4-3.5z" fill="#ffffff" opacity="0.95"/>

    <!-- Food garnishes in bowl -->
    <circle cx="28" cy="30" r="2.2" fill="#2ed573"/>
    <circle cx="35" cy="29.5" r="2" fill="#ff4757"/>
    <circle cx="32" cy="31" r="1.8" fill="#ffd32a"/>
  </g>
</svg>